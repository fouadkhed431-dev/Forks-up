name: Build Forks Up Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build web application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://hjwexjfxpmlyfunmyaqq.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_TXw-wzoYRZ9L3dmXYHbMZA_jNpbhldD

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply launcher icon from valid PNG assets
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/color android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/values/ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_colors.xml
          cp public/forks-up-512.png android/app/src/main/res/drawable/ic_launcher_foreground.png
          cat > android/app/src/main/res/values/ic_launcher_colors.xml <<'EOF'
          <resources><color name="ic_launcher_background">#F7F3E7</color></resources>
          EOF
          for name in ic_launcher ic_launcher_round; do
            cat > "android/app/src/main/res/mipmap-anydpi-v26/${name}.xml" <<EOF
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          done
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${density}"
          done
          cp public/forks-up-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp public/forks-up-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp public/forks-up-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp public/forks-up-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp public/forks-up-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp public/forks-up-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp public/forks-up-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp public/forks-up-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp public/forks-up-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp public/forks-up-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forks-up-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
