name: Build Forks Up Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build web application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://hjwexjfxpmlyfunmyaqq.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_TXw-wzoYRZ9L3dmXYHbMZA_jNpbhldD

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate and explicitly wire official Android launcher icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Image.open("public/forks-up-512.png").convert("RGBA")
          # Keep the official penguin and the complete Forks Up sign; omit the tiny slogan.
          crop = source.crop((58, 14, 456, 365))
          cream = (247, 243, 231, 255)

          # Legacy launcher icons: square cream canvas with a legible centered mark.
          for density, size in {
              "mdpi": 48, "hdpi": 72, "xhdpi": 96,
              "xxhdpi": 144, "xxxhdpi": 192
          }.items():
              out = Image.new("RGBA", (size, size), cream)
              mark = crop.copy()
              mark.thumbnail((int(size * .92), int(size * .92)), Image.Resampling.LANCZOS)
              out.alpha_composite(mark, ((size-mark.width)//2, (size-mark.height)//2))
              folder = Path(f"android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              out.save(folder / "forks_up_launcher.png")
              out.save(folder / "forks_up_launcher_round.png")

          # Android 8+ adaptive icon foreground uses a UNIQUE resource name.
          # This avoids Capacitor's default ic_launcher_foreground vector taking precedence.
          fg = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          mark = crop.copy()
          mark.thumbnail((390, 390), Image.Resampling.LANCZOS)
          fg.alpha_composite(mark, ((432-mark.width)//2, (432-mark.height)//2))
          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          fg.save(drawable / "forks_up_adaptive_foreground.png")

          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)
          (values / "forks_up_launcher_colors.xml").write_text(
              '<resources><color name="forks_up_launcher_background">#F7F3E7</color></resources>',
              encoding="utf-8"
          )
          adaptive = '''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/forks_up_launcher_background"/>
              <foreground android:drawable="@drawable/forks_up_adaptive_foreground"/>
          </adaptive-icon>'''
          adaptive_dir = Path("android/app/src/main/res/mipmap-anydpi-v26")
          adaptive_dir.mkdir(parents=True, exist_ok=True)
          (adaptive_dir / "forks_up_launcher.xml").write_text(adaptive, encoding="utf-8")
          (adaptive_dir / "forks_up_launcher_round.xml").write_text(adaptive, encoding="utf-8")

          # Explicitly bind both launcher icon attributes in the actual Android manifest.
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android_ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          app.set(android_ns + "icon", "@mipmap/forks_up_launcher")
          app.set(android_ns + "roundIcon", "@mipmap/forks_up_launcher_round")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("Launcher icon wired to @mipmap/forks_up_launcher and round variant")
          PY

      - name: Verify launcher icon resources and manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ns = "{http://schemas.android.com/apk/res/android}"
          manifest = ET.parse("android/app/src/main/AndroidManifest.xml").getroot()
          app = manifest.find("application")
          assert app is not None, "Missing application element"
          assert app.get(ns + "icon") == "@mipmap/forks_up_launcher", app.attrib
          assert app.get(ns + "roundIcon") == "@mipmap/forks_up_launcher_round", app.attrib
          required = [
              "android/app/src/main/res/drawable/forks_up_adaptive_foreground.png",
              "android/app/src/main/res/mipmap-anydpi-v26/forks_up_launcher.xml",
              "android/app/src/main/res/mipmap-anydpi-v26/forks_up_launcher_round.xml",
              "android/app/src/main/res/mipmap-xxxhdpi/forks_up_launcher.png",
              "android/app/src/main/res/mipmap-xxxhdpi/forks_up_launcher_round.png",
          ]
          for item in required:
              p = Path(item)
              assert p.is_file() and p.stat().st_size > 100, f"Missing/empty icon resource: {item}"
          print("Verified manifest references and all launcher icon variants.")
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forks-up-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
