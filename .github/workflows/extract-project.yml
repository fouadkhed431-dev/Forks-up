
name: Extract Forks Up Project

on:
  push:
    branches:
      - main
    paths:
      - 'Forks-Up-Complete-Source-v1.0.zip'
      - '.github/workflows/extract-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE="Forks-Up-Complete-Source-v1.0.zip"
          TEMP_DIR="$(mktemp -d)"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          if [ ! -f "$TEMP_DIR/package.json" ]; then
            echo "package.json not found in ZIP root!"
            exit 1
          fi

          cp -a "$TEMP_DIR/." .
          rm -rf "$TEMP_DIR"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . ':!.github/workflows/ci.yml'

          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Extract Forks Up complete project"
            git push
          fi
